; Local development PHP limits for large APK web uploads (~500 MB).
;
; Important: `php -d ... artisan serve` does NOT apply to web requests.
; Laravel spawns a fresh `php -S` child that ignores parent -d flags.
;
; For web APK upload to work, raise limits in the loaded php.ini, e.g.:
;   upload_max_filesize = 512M
;   post_max_size = 512M
;   memory_limit = 512M
;   max_execution_time = 600
;
; Then restart `php artisan serve` (or use composer dev).
;
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
